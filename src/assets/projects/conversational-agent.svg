<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Conversational agent with web search illustration">
  <defs>
    <linearGradient id="ca-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="55%" stop-color="#075985"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <radialGradient id="ca-glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ca-bubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <pattern id="ca-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#ca-bg)"/>
  <rect width="800" height="600" fill="url(#ca-dots)"/>
  <circle cx="420" cy="300" r="280" fill="url(#ca-glow)"/>

  <!-- globe -->
  <g transform="translate(560,260)" fill="none" stroke="#7dd3fc">
    <circle r="120" fill="#0e3a53" stroke-opacity="0.6" stroke-width="2.5"/>
    <ellipse rx="120" ry="42" stroke-opacity="0.45" stroke-width="1.75"/>
    <ellipse rx="120" ry="42" stroke-opacity="0.45" stroke-width="1.75" transform="rotate(60)"/>
    <ellipse rx="120" ry="42" stroke-opacity="0.45" stroke-width="1.75" transform="rotate(120)"/>
    <line x1="-120" y1="0" x2="120" y2="0" stroke-opacity="0.45" stroke-width="1.75"/>
    <line x1="0" y1="-120" x2="0" y2="120" stroke-opacity="0.3" stroke-width="1.5"/>
  </g>

  <!-- magnifying glass over globe -->
  <g transform="translate(636,350)">
    <circle r="34" fill="#0c4a6e" stroke="#ffffff" stroke-width="8"/>
    <line x1="24" y1="24" x2="52" y2="52" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- connecting path: search results flowing into the conversation -->
  <path d="M600,342 C520,300 450,282 366,268" fill="none" stroke="#e0f2fe" stroke-opacity="0.6" stroke-width="3" stroke-dasharray="2 11" stroke-linecap="round"/>
  <circle cx="600" cy="342" r="5" fill="#ffffff"/>
  <circle cx="366" cy="268" r="5" fill="#ffffff"/>

  <!-- chat bubble -->
  <rect x="60" y="190" width="300" height="174" rx="26" fill="url(#ca-bubble)"/>
  <path d="M100,364 L130,364 L74,410 Z" fill="url(#ca-bubble)"/>

  <rect x="90" y="230" width="220" height="12" rx="6" fill="#0c4a6e" fill-opacity="0.25"/>
  <rect x="90" y="258" width="240" height="12" rx="6" fill="#0c4a6e" fill-opacity="0.25"/>
  <rect x="90" y="286" width="150" height="12" rx="6" fill="#0c4a6e" fill-opacity="0.25"/>

  <circle cx="90" cy="330" r="9" fill="#0891b2"/>
  <circle cx="122" cy="330" r="9" fill="#0891b2" fill-opacity="0.7"/>
  <circle cx="154" cy="330" r="9" fill="#0891b2" fill-opacity="0.4"/>

  <!-- streaming signal near top-right of bubble -->
  <g transform="translate(348,178)" stroke="#e0f2fe" stroke-opacity="0.75" fill="none" stroke-width="4" stroke-linecap="round">
    <path d="M0,20 A20,20 0 0 1 20,0"/>
    <path d="M-10,30 A34,34 0 0 1 30,-10"/>
    <path d="M-20,40 A48,48 0 0 1 40,-20"/>
  </g>
</svg>
