<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Enterprise AI Safety and Transparency Platform illustration">
  <defs>
    <linearGradient id="es-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="55%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <radialGradient id="es-glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="es-shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="es-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#es-bg)"/>
  <rect width="800" height="600" fill="url(#es-dots)"/>
  <circle cx="400" cy="270" r="260" fill="url(#es-glow)"/>

  <!-- distributed monitoring network -->
  <g stroke="#93c5fd" stroke-opacity="0.28" stroke-width="1.5">
    <line x1="400" y1="300" x2="120" y2="120"/>
    <line x1="400" y1="300" x2="680" y2="120"/>
    <line x1="400" y1="300" x2="120" y2="480"/>
    <line x1="400" y1="300" x2="680" y2="480"/>
  </g>
  <g>
    <circle cx="120" cy="120" r="10" fill="none" stroke="#93c5fd" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="120" cy="120" r="5" fill="#c7d2fe"/>
    <circle cx="680" cy="120" r="10" fill="none" stroke="#93c5fd" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="680" cy="120" r="5" fill="#c7d2fe"/>
    <circle cx="120" cy="480" r="10" fill="none" stroke="#93c5fd" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="120" cy="480" r="5" fill="#c7d2fe"/>
    <circle cx="680" cy="480" r="10" fill="none" stroke="#93c5fd" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="680" cy="480" r="5" fill="#c7d2fe"/>
  </g>

  <!-- audit log strip, bottom-left -->
  <g transform="translate(96,500)" opacity="0.55">
    <circle cx="0" cy="0" r="4" fill="#a5b4fc"/>
    <rect x="14" y="-3" width="140" height="6" rx="3" fill="#a5b4fc"/>
    <circle cx="0" cy="20" r="4" fill="#a5b4fc"/>
    <rect x="14" y="17" width="100" height="6" rx="3" fill="#a5b4fc"/>
    <circle cx="0" cy="40" r="4" fill="#a5b4fc"/>
    <rect x="14" y="37" width="120" height="6" rx="3" fill="#a5b4fc"/>
  </g>

  <!-- central shield -->
  <g transform="translate(400,300)">
    <path d="M0,-160 L120,-110 L120,10 C120,110 60,170 0,200 C-60,170 -120,110 -120,10 L-120,-110 Z"
          fill="url(#es-shield)" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3"/>

    <!-- padlock -->
    <path d="M-24,-14 v-22 a24,24 0 0 1 48,0 v22" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
    <rect x="-38" y="-14" width="76" height="58" rx="10" fill="#ffffff"/>
    <circle cx="0" cy="9" r="8" fill="#4338ca"/>
    <rect x="-4" y="13" width="8" height="16" rx="3" fill="#4338ca"/>

    <!-- verified badge -->
    <g transform="translate(92,140)">
      <circle r="30" fill="#22c55e" stroke="#1e1b4b" stroke-width="4"/>
      <path d="M-12,0 L-3,10 L14,-12" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
