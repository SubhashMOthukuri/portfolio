<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Clinical medication reconciliation RAG system illustration">
  <defs>
    <linearGradient id="cr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#134e4a"/>
      <stop offset="55%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <radialGradient id="cr-glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cr-icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <pattern id="cr-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#cr-bg)"/>
  <rect width="800" height="600" fill="url(#cr-dots)"/>
  <circle cx="400" cy="270" r="260" fill="url(#cr-glow)"/>

  <!-- knowledge network -->
  <g stroke="#5eead4" stroke-opacity="0.28" stroke-width="1.5">
    <line x1="400" y1="300" x2="120" y2="120"/>
    <line x1="400" y1="300" x2="680" y2="120"/>
    <line x1="400" y1="300" x2="120" y2="480"/>
    <line x1="400" y1="300" x2="680" y2="480"/>
  </g>
  <g>
    <circle cx="120" cy="120" r="10" fill="none" stroke="#5eead4" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="120" cy="120" r="5" fill="#99f6e4"/>
    <circle cx="680" cy="120" r="10" fill="none" stroke="#5eead4" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="680" cy="120" r="5" fill="#99f6e4"/>
    <circle cx="120" cy="480" r="10" fill="none" stroke="#5eead4" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="120" cy="480" r="5" fill="#99f6e4"/>
    <circle cx="680" cy="480" r="10" fill="none" stroke="#5eead4" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="680" cy="480" r="5" fill="#99f6e4"/>
  </g>

  <!-- citation/record strip, bottom-left -->
  <g transform="translate(96,500)" opacity="0.55">
    <circle cx="0" cy="0" r="4" fill="#99f6e4"/>
    <rect x="14" y="-3" width="140" height="6" rx="3" fill="#99f6e4"/>
    <circle cx="0" cy="20" r="4" fill="#99f6e4"/>
    <rect x="14" y="17" width="100" height="6" rx="3" fill="#99f6e4"/>
    <circle cx="0" cy="40" r="4" fill="#99f6e4"/>
    <rect x="14" y="37" width="120" height="6" rx="3" fill="#99f6e4"/>
  </g>

  <!-- central icon: medication + cross -->
  <g transform="translate(400,300)">
    <rect x="-110" y="-110" width="220" height="220" rx="48" fill="url(#cr-icon)" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3"/>

    <!-- capsule -->
    <g transform="rotate(-45)">
      <rect x="-56" y="-24" width="112" height="48" rx="24" fill="#ffffff"/>
      <rect x="-56" y="-24" width="56" height="48" rx="24" fill="#0d9488"/>
      <path d="M-28,-24 v48" stroke="#0d9488" stroke-width="2" opacity="0.4"/>
    </g>

    <!-- medical cross badge -->
    <g transform="translate(66,66)">
      <circle r="34" fill="#ffffff"/>
      <rect x="-16" y="-4" width="32" height="8" rx="2" fill="#0d9488"/>
      <rect x="-4" y="-16" width="8" height="32" rx="2" fill="#0d9488"/>
    </g>
  </g>
</svg>
